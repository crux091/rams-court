{% extends "base.html" %}

{% block title %}Edit Announcement - Rams Court{% endblock %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 2rem auto;">
    <h2 style="text-align: center; color: var(--apc-dark-blue); margin-bottom: 2rem;">
        Edit Announcement
    </h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="title">Announcement Title:</label>
            <input type="text" id="title" name="title" required 
                   value="{{ announcement[1] }}"
                   placeholder="e.g., Court Maintenance Notice">
        </div>
        
        <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="4" required 
                      placeholder="Enter your announcement message here...">{{ announcement[2] }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="status">Court Status:</label>
            <select id="status" name="status" required>
                <option value="">Select Status</option>
                <option value="available" {% if announcement[3] == 'available' %}selected{% endif %}>Available</option>
                <option value="maintenance" {% if announcement[3] == 'maintenance' %}selected{% endif %}>Under Maintenance</option>
                <option value="closed" {% if announcement[3] == 'closed' %}selected{% endif %}>Temporarily Closed</option>
                <option value="closed" {% if announcement[3] == 'closed' %}selected{% endif %}>School Event</option>
            </select>
        </div>
        
        <div class="form-group">
            <label for="start_at">Start Date & Time:</label>
            <input type="datetime-local" id="start_at" name="start_at" required value="{{ announcement[6]|replace(' ', 'T') }}">
        </div>
        
        <div class="form-group">
            <label for="end_at">End Date & Time:</label>
            <input type="datetime-local" id="end_at" name="end_at" required value="{{ announcement[7]|replace(' ', 'T') }}">
        </div>
        
        <div style="display: flex; gap: 1rem; margin-top: 1rem;">
            <button type="submit" class="btn" style="flex: 1;">Update Announcement</button>
            <a href="{{ url_for('manage_announcements') }}" class="btn btn-danger" style="flex: 1; text-align: center;">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
